<!doctype html>
<!-- so basically this tells about html5 that we are using it and it can run without thius but can go into quirks mode which can create problem in css code or layout-->
<html lang="en">
  <!-- Ye accessibility tools aur search engines ke liye useful hota hai.this tells the language so helpfull in seo and html tag contains the whole code ye main root element hai
    lang="en"    → Attribute
Attribute tag ko additional information deta hai.-->
  <head>
    <!-- ye saari info isme hoti hai jo dikhti nhi hai Page ka title
Character encoding
Mobile responsiveness settings
CSS files
SEO-related metadata
Favicon
etc.-->
    <meta charset="UTF-8" />
    <!--Ye browser ko batata hai ki webpage mein characters ko kaise interpret karna hai.
Metadata = webpage ke baare mein information
UTF-8 ek character encoding hai jo almost saare commonly used characters ko support karta hai.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Website ko device ke according adapt karne mein ye important role play karta hai.
    initial-scale=1.0 ,(meta is a void element, so iska closing tag nahi hota).
Matlab page ko initially 100% zoom par load karo.-->
    <title>Chapter 1</title>
    <!--Ye webpage ka title set karta hai.-->
  </head>
  <body>
    <!--YAHAN SE ACTUAL VISIBLE WEBPAGE CONTENT START HOTA HAI.
    DOM = Document Object Model
Browser tumhare HTML code ko ek tree-like structure mein convert karta hai. Us structure ko DOM kehte hain.
use -JavaScript DOM ko use karke HTML page ko change kar sakti hai.-->
    <h1>This is case sensitive so both h1 and H1 are okay in this tag</h1>
    <!--this is element complete with the info inside it-->
  </body>
</html>

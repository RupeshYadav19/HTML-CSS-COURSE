<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Format</title>
</head>

<body>
    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
        <!-- so basically we can add Website logo, Website name ,Main heading, Navigation ,
     Introduction in header -->
        <!-- header ka matlab sirf website
       ka topmost part hi nahi hota. Ye kisi section/article ka header bhi ho sakta hai -->
        <nav>
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav> <!--<nav> ka use navigation links ke liye hota hai.-->
    </header>
    <main>

    <h1>Welcome to my website</h1>

    <p>This is the main content.</p>

</main> <!--Jo webpage ka actual important content hai, wo <main> ke andar rakhte hain.-->
    <footer>
    <p>Copyright © 2026 My Website</p>
</footer> <!--Footer mein commonly:
Copyright
Contact information
Social links
Additional links
Legal information-->
</body>

</html>

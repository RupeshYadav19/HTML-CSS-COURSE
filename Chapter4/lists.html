<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists | Chapter 4</title>
    <meta name="description" content="Learn how to create and use ordered, unordered, and description lists in HTML.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://example.com/chapter4/lists.html">
</head>
<body>
    <!--Ordered List-->
    <ol><!--mali yeh apne ko number twice dikhati hai wo -->
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ol>

    <!--Unordered List-->
    <ul><!--apne ko unordered list, matlab number nahi dikhati, simple dots ke type mein dikhati. -->
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>

    <!--Description List-->
    <dl><!--Description list, matlab har term ke liye ek description hoti hai. -->
        <dt>HTML</dt><!--So, DT ka matlab hota hai Definition Term And DD ka matlab hota hai Description -->
        <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>
</body>
</html>
